name: on_commit

# Generated from plexus-ms/template-repo-turbo: edit the template, never this file.
# An app repo's mount for a push to any other branch, check alone (§ 2 PLX-Delivery).

on:
  push:
    branches-ignore: [main, develop]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: on_commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.128.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      turbo-cache: false
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
