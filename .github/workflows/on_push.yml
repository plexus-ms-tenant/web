name: on_push

# Generated from plexus-ms/template-repo-turbo: edit the template, never this file.
# An app repo's environment-branch mount, check, verify, release (§§ 2 and 3 PLX-Delivery).

on:
  # No paths filter: a branch created at a known commit pushes no files and would start nothing.
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  check:
    concurrency:
      group: on_push-verify-${{ github.ref }}
      cancel-in-progress: true
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.124.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      turbo-cache: false
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  verify:
    needs: check
    concurrency:
      group: on_push-verify-${{ github.ref }}
      cancel-in-progress: true
    uses: plexus-ms/tooling/.github/workflows/_verify.yml@0.124.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      registry: ghcr
      deploy: true
      alerts-email: ''
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  release:
    needs: verify
    uses: plexus-ms/tooling/.github/workflows/_release.yml@0.124.0
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      registry: ghcr
      overlay: none
      apps: ${{ needs.verify.outputs.apps }}
      deploys: ${{ needs.verify.outputs.deploys }}
      environment: ${{ needs.verify.outputs.environment }}
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
