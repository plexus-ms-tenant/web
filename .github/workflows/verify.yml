name: verify

# Mounts the verify verb on every push (§ 2 PLX-Delivery): is the repo sound?
# One repo-wide job; the per-app gate before a release is deploy.yml's own.
# Managed by copier: edit the preset (plexus-ms/preset-repo-web), never this file.

on:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Where the jobs run (repo variables): CI_RUNNER is the runner label, unset
# for GitHub's runners; CI_RUNNER_PERSISTENT is `true` when that runner keeps
# its disk between jobs, so caches stay local. Unset both to be back on
# GitHub's runners with the next push.
jobs:
  verify:
    uses: plexus-ms/primitives/.github/workflows/_verify.yml@0.101.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}

