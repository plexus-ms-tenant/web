name: on_pr

# Generated from plexus-ms/template-repo-turbo: edit the template, never this file.
# An app repo's pull-request mount, check then verify (§ 2 PLX-Delivery).

on:
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: on_pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: plexus-ms/tooling/.github/workflows/_check.yml@0.129.1
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      turbo-cache: false
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  verify:
    needs: check
    uses: plexus-ms/tooling/.github/workflows/_verify.yml@0.129.1
    with:
      strategy: ${{ vars.CI_STRATEGY || 'github' }}
      registry: ghcr
      alerts-email: ''
    secrets:
      op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
