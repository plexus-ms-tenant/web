name: deploy

# Mounts the verbs on a push to an environment branch (§§ 2 and 3
# PLX-Delivery): `changed-apps` emits the apps whose sources changed, and `app`
# fans the per-app pipeline (verify → release → deploy) over exactly those —
# a docs-only push releases nothing, a shared-package change redeploys its
# dependents. Deploying needs a host: `main` deploys to DEPLOY_HOST, `develop`
# releases and stops until a staging host exists. Managed by copier: edit the
# preset (plexus-ms/preset-repo-web), never this file.

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

# Where the jobs run: see verify.yml.
jobs:
  changed-apps:
    uses: plexus-ms/ci-cd/.github/workflows/_changed-apps.yml@0.68.0
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

  app:
    needs: changed-apps
    # Empty matrix is an error, not a no-op — skip the job when nothing changed.
    if: ${{ needs.changed-apps.outputs.apps != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changed-apps.outputs.apps) }}
    uses: plexus-ms/ci-cd/.github/workflows/_pipeline.yml@0.68.0
    with:
      tenant: plexus
      app: ${{ matrix.app }}
      deploy: ${{ github.ref == 'refs/heads/main' }}
      host: ${{ vars.DEPLOY_HOST }}
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      persistent: ${{ vars.CI_RUNNER_PERSISTENT == 'true' }}
    secrets:
      ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

