services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Values the platform provides (§ 7.1, § 7.2 PLX): secrets.env holds the
    # app's secrets, platform.env its non-secret values from the inventory's
    # apps[].env — plus the PLEXUS_* bindings, which are reserved and harmless
    # inside the container. Both optional so the file also runs in local dev.
    env_file:
      - path: secrets.env
        required: false
      - path: platform.env
        required: false
    ports:
      # Host port from platform.env (§ 5.4 PLX) — assigned by the platform from
      # the tenant's inventory, never hardcoded. No fallback: a missing binding
      # fails loudly. Container port stays 3000 (the app's own concern).
      - "127.0.0.1:${PLEXUS_APP_PORT}:3000"
    labels:
      plexus.tenant: plexus
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
