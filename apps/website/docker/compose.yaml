services:
  web:
    image: ${PLEXUS_DEPLOYMENT_IMAGE:?rendered by the deploy verb}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file:
      - path: .env
        required: false
      - path: .env.secret
        required: false
    ports:
      - "127.0.0.1:${PLEXUS_LOOPBACK_PORT}:3000"
    labels:
      plexus.tenant: plexus
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
