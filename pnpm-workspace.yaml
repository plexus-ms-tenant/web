packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  sharp: true
catalog:
  typescript: ^6.0.3
# A third-party release is installable three days after it is published (§ 2 PLX-Updates);
# the shared Renovate preset waits the same three days before proposing it.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@plexus-ms/*"
# The train-versioned packages (§ 1.6 PLX), pinned once for the whole workspace: every
# manifest says `catalog:plexus`, and the train writes the version (§ 1 PLX-Updates);
# the update bot leaves it alone.
catalogs:
  plexus:
    "@plexus-ms/config": 0.102.0
