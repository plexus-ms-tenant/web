monorepo_root = true

[monorepo]
config_roots = ["apps/*", "packages/*"]

[tools]
node = "24" # the runtime; actions/setup-node reads it from here too
hk = "latest" # Git hooks
uv = "latest" # required for copier
copier = { version = "latest", uvx = true } # template management
# plx: the ops verbs the reusable workflows mount — deploy-targets, deploy
# (§ 6 PLX-Delivery). The initiative's own package, published from
# plexus-ms/primitives at the train number and pinned by the train, never by
# the update bot (§ 1 PLX-Updates); the trust-policy approval only waives
# npm's young-package heuristics.
"npm:@plexus-ms/cli" = { version = "0.114.0", allow_low_downloads = true }
# plx-ci: the CI verbs, plan, build, test and publish (§ 8 PLX-Delivery), the
# same package family at the same train number.
"npm:@plexus-ms/cli-ci" = { version = "0.114.0", allow_low_downloads = true }

[settings]
# Not a version source: node is pinned in [tools]. It makes package.json one of
# node's idiomatic files, which is what lets [monorepo].config_roots match a
# packages/* (or apps/*) directory that has no mise config of its own; without
# it `mise install --monorepo` fails in a repo whose roots are only packages.
idiomatic_version_file_enable_tools = ["node"]

[hooks]
# Wire up Git hooks and get pnpm from packageManager
# On a CI runner whose mise installs only the tools a job names, hk is absent
# and the hook is not needed; it stays silent instead of failing.
postinstall = "if command -v hk >/dev/null; then hk install --mise; fi && npx corepack enable"

[env]
# Command lines will be "turbo build" instead of "pnpm exec turbo build".
_.path = ["{{config_root}}/node_modules/.bin"]


[tasks.promote]
description = "Promote staging to prod: fast-forward main to what is on develop (§ 3 PLX-Delivery); refused unless it is a fast-forward"
run = 'git fetch -q origin && git push origin origin/develop:refs/heads/main'

# Contract verbs

[tasks.dev]
depends = ["install"]
description = "Prepare a development environment and start it"
usage = 'arg "[app]" help="App to start (e.g. my-app, defaults to all)"'
run = 'turbo run dev ${usage_app:+--filter=./apps/$usage_app}'

[tasks.verify]
description = "Perform all steps that verify code quality"
# The one verb the pipeline mounts (§ 1 PLX-Delivery) — it knows this name and
# no other. An optional scope forwards to check/test so a pipeline leg can
# path-scope to one app plus its dependency packages (§ 3 PLX-Delivery); lint
# stays cheap and repo-wide. lint, check and test are the sub-verbs of § 3
# PLX-Repo: lint on pre-commit, check on pre-push, test here.
usage = 'arg "[scope]" help="App or package to verify (e.g. apps/my-app, defaults to all)"'
run = [
    'mise run lint',
    'mise run check ${usage_scope:+"$usage_scope"}',
    'mise run test ${usage_scope:+"$usage_scope"}',
]

# The ops side — playbooks, inventory, secrets pointers — is not here: it lives
# in the tenant's operations repo (§ 3 PLX-Tenancy), generated from plexus-ms/preset-repo-operations.

# Propagation tasks

[tasks.sync]
description = "Update the project to the latest template version with Copier"
run = "copier update --trust"

# Internal / hidden tasks

[tasks.install]
description = "Install and wire up project dependencies"
hide = true
run = "pnpm install"
sources = ["package.json", "apps/*/package.json", "packages/*/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.lint]
depends = ["install"]
description = "Lint and format the codebase"
usage = '''
flag "--write" help="Apply safe fixes and formatting in place"
arg "<paths>" var=#true default="." help="Files or directories to lint (defaults to the whole repo)"
'''
# usage shell-quotes var-arg values, so re-parse them via eval instead of bare expansion.
run = 'eval "set -- $usage_paths"; biome check ${usage_write:+--write} --no-errors-on-unmatched "$@"'

[tasks.check]
depends = ["install"]
description = "Run static checks on the codebase"
usage = 'arg "[package]" help="App or package to check (e.g. apps/my-app, defaults to all)"'
run = ['turbo run check ${usage_package:+--filter=./$usage_package}']

[tasks.test]
depends = ["install"]
description = "Run tests on the codebase"
usage = 'arg "[package]" help="App or package to test (e.g. apps/my-app, defaults to all)"'
run = 'turbo run test ${usage_package:+--filter=./$usage_package}'
