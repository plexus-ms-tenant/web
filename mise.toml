monorepo_root = true

[monorepo]
config_roots = ["apps/*", "packages/*"]

[tools]
hk = "latest" # Git hooks
biome = "latest" # formatter and linter
uv = "latest" # required for copier
copier = { version = "latest", uvx = true } # template management

[settings]
# Install node from .node-version
idiomatic_version_file_enable_tools = ["node"]

[hooks]
# Wire up Git hooks and get pnpm from packageManager
postinstall = "hk install --mise && npx corepack enable"

[env]
# Command lines will be "turbo build" instead of "pnpm exec turbo build".
_.path = ["{{config_root}}/node_modules/.bin"]


# Contract verbs

[tasks.dev]
depends = ["install"]
description = "Prepare a development environment and start it"
usage = 'arg "[app]" help="App to start (e.g. my-app, defaults to all)"'
run = 'turbo run dev ${usage_app:+--filter=./apps/$usage_app}'

[tasks.verify]
description = "Perform all steps that verify code quality"
# The single verb CI mounts (§ 8.5 PLX) — CI knows this name and no other.
# An optional scope forwards to check/test so a CI leg can path-scope to one app
# plus its dependency packages (§ 8.2 PLX); lint stays cheap and repo-wide.
usage = 'arg "[scope]" help="App or package to verify (e.g. apps/my-app, defaults to all)"'
run = [
    'mise run lint',
    'mise run check ${usage_scope:+"$usage_scope"}',
    'mise run test ${usage_scope:+"$usage_scope"}',
]

# The ops side — playbooks, inventory, secrets pointers — is not here: it lives
# in the tenant's platform repo (§ 3.6 PLX), generated from plexus-ms/preset-repo-platform.

# Propagation tasks

[tasks.sync]
description = "Update the project to the latest template version with Copier"
run = "copier update --trust"

# Internal / hidden tasks

[tasks.install]
description = "Install and wire up project dependencies"
hide = true
run = "pnpm install"
sources = ["package.json", "apps/*/package.json", "packages/*/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.lint]
depends = ["install"]
description = "Lint and format the codebase"
usage = '''
flag "--write" help="Apply safe fixes and formatting in place"
arg "<paths>" var=#true default="." help="Files or directories to lint (defaults to the whole repo)"
'''
# usage shell-quotes var-arg values, so re-parse them via eval instead of bare expansion.
run = 'eval "set -- $usage_paths"; biome check ${usage_write:+--write} --no-errors-on-unmatched "$@"'

[tasks.check]
depends = ["install"]
description = "Run static checks on the codebase"
usage = 'arg "[package]" help="App or package to check (e.g. apps/my-app, defaults to all)"'
run = ['turbo run check ${usage_package:+--filter=./$usage_package}']

[tasks.test]
depends = ["install"]
description = "Run tests on the codebase"
usage = 'arg "[package]" help="App or package to test (e.g. apps/my-app, defaults to all)"'
run = 'turbo run test ${usage_package:+--filter=./$usage_package}'
